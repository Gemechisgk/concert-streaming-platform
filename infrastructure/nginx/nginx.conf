events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/xml application/json text/css application/javascript application/x-mpegURL;

    upstream nextjs_upstream {
        server host.docker.internal:3000;
        keepalive 32;
    }

    upstream realtime_upstream {
        server host.docker.internal:3001;
        keepalive 32;
    }

    upstream srs_hls_upstream {
        server host.docker.internal:8080;
        keepalive 64;
    }

    server {
        listen 80;
        server_name localhost;

        # HLS Video Stream Delivery & Caching
        location /live/ {
            proxy_pass http://srs_hls_upstream/;
            proxy_set_header Host $host;
            add_header Cache-Control "max-age=2, must-revalidate";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
        }

        # Real-time WebSocket connection
        location /socket.io/ {
            proxy_pass http://realtime_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Next.js Application
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
