# ============================================================================
# FESHTA FEST LIVE PLATFORM — EDGE CDN NGINX CONFIGURATION
# Production Edge Cache-Key Policy & Strict Token Auth-Before-Cache Architecture
# ============================================================================

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Gzip compression for manifests and JSON
    gzip on;
    gzip_types text/plain application/xml application/json text/css application/javascript application/x-mpegURL application/vnd.apple.mpegurl;

    # ------------------------------------------------------------------------
    # Edge Proxy Cache Storage Zones
    # ------------------------------------------------------------------------
    # 1. Segment Zone: 10GB shared memory cache for immutable .ts video segments
    proxy_cache_path /var/cache/nginx/hls_segments levels=1:2 keys_zone=HLS_SEGMENTS:100m max_size=10g inactive=24h use_temp_path=off;
    
    # 2. Manifest Zone: 1GB short-TTL cache for live .m3u8 sliding playlists
    proxy_cache_path /var/cache/nginx/hls_manifests levels=1:2 keys_zone=HLS_MANIFESTS:20m max_size=1g inactive=10m use_temp_path=off;

    upstream nextjs_upstream {
        server host.docker.internal:3000;
        keepalive 32;
    }

    upstream realtime_upstream {
        server host.docker.internal:3001;
        keepalive 32;
    }

    # Primary and Standby Origin Pool (Origin Redundancy)
    upstream srs_origin_pool {
        server host.docker.internal:8080 max_fails=2 fail_timeout=5s;
        server host.docker.internal:8081 backup; # Standby SRS Origin Hot-Spare
        keepalive 64;
    }

    server {
        listen 80;
        server_name localhost cdn.feshtafest.com;

        # --------------------------------------------------------------------
        # Edge Auth Subrequest: Validates signed HMAC token BEFORE serving cache
        # --------------------------------------------------------------------
        location = /_auth_token {
            internal;
            proxy_pass http://nextjs_upstream/api/v1/streams/validate-edge-token;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $host;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # --------------------------------------------------------------------
        # HLS Segments Delivery (.ts): Normalized Cache-Key with Pre-Auth Gate
        # --------------------------------------------------------------------
        location ~* \.(ts|m4s)$ {
            # 1. MANDATORY: Authenticate client token BEFORE accessing cache
            auth_request /_auth_token;
            auth_request_set $auth_user $upstream_http_x_viewer_user_id;

            # 2. Proxy cache lookup with normalized URI (Token stripped from cache key)
            # This allows 50,000 authorized viewers to share the exact same segment cache!
            proxy_cache HLS_SEGMENTS;
            proxy_cache_key "$scheme$request_method$host$uri";
            proxy_cache_valid 200 24h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 2s;

            # 3. Origin Proxy pass
            proxy_pass http://srs_origin_pool;
            proxy_set_header Host $host;

            # Cache headers sent to viewer
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Edge-Auth-User $auth_user always;
            add_header Cache-Control "public, max-age=86400, s-maxage=604800, immutable";
            add_header Vary "Authorization, x-playback-token";
            add_header Access-Control-Allow-Origin *;
        }

        # --------------------------------------------------------------------
        # HLS Manifests Delivery (.m3u8): Short TTL with Pre-Auth Gate
        # --------------------------------------------------------------------
        location ~* \.m3u8$ {
            # Mandatory Edge Auth check
            auth_request /_auth_token;

            proxy_cache HLS_MANIFESTS;
            proxy_cache_key "$scheme$request_method$host$uri$is_args$args";
            proxy_cache_valid 200 1s;

            proxy_pass http://srs_origin_pool;
            proxy_set_header Host $host;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=1, s-maxage=2, stale-while-revalidate=1";
            add_header Vary "Authorization, x-playback-token";
            add_header Access-Control-Allow-Origin *;
        }

        # --------------------------------------------------------------------
        # Real-time WebSocket connection
        # --------------------------------------------------------------------
        location /socket.io/ {
            proxy_pass http://realtime_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # --------------------------------------------------------------------
        # Next.js Application Core
        # --------------------------------------------------------------------
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
