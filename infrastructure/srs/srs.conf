# Feshta Fest SRS Media Origin Server Configuration
# Multi-Camera Live Streaming with Dual RTMP + SRT Ingest
# Reference: Blueprint Section 9 & 13

max_connections     5000;
daemon              off;
srs_log_tank        console;

# RTMP Ingest & Relay
rtmp {
    listen          1935;
}

# SRT Ingest Server (High-reliability low-latency stage camera ingestion)
srt_server {
    enabled         on;
    listen          10080;
    maxbw           1000000000;
    connect_timeout 4000;
    peerlatency     20;
    recvlatency     20;
    latency         20;
    tlpktdrop       on;
    sendbuf         2000000;
    recvbuf         2000000;
    default_streamid "#!::r=live/livestream,m=publish";
}

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    # Bridge incoming SRT camera streams directly into RTMP and HLS packaging
    srt {
        enabled     on;
        srt_to_rtmp on;
    }

    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      12;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_wait_keyframe on;
        hls_entry_prefix /live;
    }

    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:3000/api/v1/stream-hooks/publish;
        on_unpublish    http://host.docker.internal:3000/api/v1/stream-hooks/unpublish;
        on_play         http://host.docker.internal:3000/api/v1/stream-hooks/play;
    }
}
