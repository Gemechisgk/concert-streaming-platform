listen              1935;
max_connections     10000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

http_api {
    enabled         on;
    listen          1985;
}

vhost __defaultVhost__ {
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      12;
        hls_wait_keyframe on;
        hls_entry_prefix /live;
    }

    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:3000/api/v1/stream-hooks/publish;
        on_unpublish    http://host.docker.internal:3000/api/v1/stream-hooks/unpublish;
        on_play         http://host.docker.internal:3000/api/v1/stream-hooks/play;
        on_stop         http://host.docker.internal:3000/api/v1/stream-hooks/stop;
    }
}
